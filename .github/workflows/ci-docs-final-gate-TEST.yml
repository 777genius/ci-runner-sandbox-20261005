name: TEST docs intermediate and full final gate
on:
  pull_request:
    types: [opened, synchronize, labeled, unlabeled]
    paths: ['README.md']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scope:
    runs-on: ubicloud-standard-4-arm
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        run: python3 scripts/ci_macos_scope.py classify
  test:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.mode != 'docs' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [namespace-profile-macos-15, namespace-profile-macos-26]
    timeout-minutes: 3
    steps:
      - name: Actual native TEST probe
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = macOS
          test "$(uname -m)" = arm64
          sw_vers
  swift-test:
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.mode != 'docs' }}
    runs-on: namespace-profile-macos-15
    timeout-minutes: 3
    steps:
      - name: Actual Swift TEST probe
        run: swift --version
  full-ci:
    needs: [scope, test, swift-test]
    if: ${{ always() }}
    runs-on: ubicloud-standard-4-arm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require full same-revision native success
        env:
          CI_MODE: ${{ needs.scope.outputs.mode }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci_macos_scope.py gate test swift-test
