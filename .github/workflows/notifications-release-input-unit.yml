name: Notifications integrated release input fixtures
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-input-fixtures:
    runs-on: ubicloud-standard-4
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          repository: 777genius/agent-notifications
          ref: 53b298270488b210e5cb4c4c1fb0fd530f0186af
          path: notifications
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify private custody fixtures without native execution
        working-directory: notifications
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = 53b298270488b210e5cb4c4c1fb0fd530f0186af
          python3 -B scripts/testdata/opencode-native-e2e/test_release_inputs.py
