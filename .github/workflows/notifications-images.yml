name: Notifications provider image canary
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubicloud-standard-4-arm, version: '24.04', arch: aarch64}
          - {runner: ubicloud-standard-4-arm-ubuntu-2204, version: '22.04', arch: aarch64}
          - {runner: namespace-profile-macos-15, version: '15', arch: arm64}
          - {runner: namespace-profile-macos-26, version: '26', arch: arm64}
    steps:
      - name: Assert architecture and image, inspect PowerShell prerequisite
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          test "$(uname -m)" = '${{ matrix.arch }}'
          if [[ "$RUNNER_OS" = Linux ]]; then
            source /etc/os-release
            test "$VERSION_ID" = '${{ matrix.version }}'
          else
            sw_vers
            test "$(sw_vers -productVersion | cut -d. -f1)" = '${{ matrix.version }}'
          fi
          if command -v pwsh; then pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'; else echo 'PowerShell prerequisite missing'; fi
