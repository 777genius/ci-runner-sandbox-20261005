name: TEST native parallel provider semantics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  overlap:
    strategy:
      fail-fast: false
      matrix:
        runner: [namespace-profile-macos-15, ubicloud-standard-4-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 3
    steps:
      - name: Create isolated proof directory
        run: mkdir -p "$RUNNER_TEMP/TEST-native-parallel"
      - parallel:
          - name: First independent writer
            shell: bash
            run: |
              set -euo pipefail
              proof="$RUNNER_TEMP/TEST-native-parallel"
              touch "$proof/first.started"
              for i in {1..20}; do
                if test -f "$proof/second.started"; then touch "$proof/first.overlapped"; break; fi
                sleep 1
              done
              test -f "$proof/first.overlapped"
              echo first > "$proof/first.completed"
          - name: Second independent writer
            shell: bash
            run: |
              set -euo pipefail
              proof="$RUNNER_TEMP/TEST-native-parallel"
              touch "$proof/second.started"
              for i in {1..20}; do
                if test -f "$proof/first.started"; then touch "$proof/second.overlapped"; break; fi
                sleep 1
              done
              test -f "$proof/second.overlapped"
              echo second > "$proof/second.completed"
      - name: Assert completion barrier
        shell: bash
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/TEST-native-parallel"
          test "$(cat "$proof/first.completed")" = first
          test "$(cat "$proof/second.completed")" = second
          test -f "$proof/first.overlapped"
          test -f "$proof/second.overlapped"
          echo "Native parallel overlap and completion barrier proven on $RUNNER_OS"
