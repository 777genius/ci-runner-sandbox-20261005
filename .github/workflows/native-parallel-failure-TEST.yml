name: TEST native parallel failure propagation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  expected-failure:
    strategy:
      fail-fast: false
      matrix:
        runner: [namespace-profile-macos-15, ubicloud-standard-4-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 3
    steps:
      - name: Create isolated proof directory
        run: mkdir -p "$RUNNER_TEMP/TEST-native-parallel-failure"
      - parallel:
          - name: Intentionally fail one prerequisite
            run: exit 17
          - name: Finish other prerequisite
            run: touch "$RUNNER_TEMP/TEST-native-parallel-failure/other.completed"
      - name: Native app surrogate must be skipped
        run: touch "$RUNNER_TEMP/TEST-native-parallel-failure/forbidden.started"
      - name: Verify failure blocked dependent execution
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/TEST-native-parallel-failure"
          test -f "$proof/other.completed"
          test ! -f "$proof/forbidden.started"
          echo "Expected prerequisite failure blocked dependent native execution on $RUNNER_OS"
