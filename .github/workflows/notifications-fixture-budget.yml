name: Notifications Windows fixture budget canary
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notifier:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            go: '1.25'
          - runner: windows-latest
            go: '1.26'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          repository: 777genius/agent-notifications
          ref: b0b06fc9451942e8d785e2d793772503582d6efc
          path: source
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          path: fixture
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Install Linux build prerequisite
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Apply test-only overlay and run notifier race suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item fixture/budget-overlay/store_process_test.go source/internal/config/store_process_test.go
          Copy-Item fixture/budget-overlay/admission_test.go source/internal/opencodeevent/admission_test.go
          Copy-Item fixture/budget-overlay/admission_revision_test.go source/internal/opencodeevent/admission_revision_test.go
          Set-Location source
          go test -count=3 -race -timeout 5m -v ./internal/config -run '^TestStoreProcessCrashReleasesLock$'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -count=3 -race -timeout 5m -v ./internal/opencodeevent -run '^TestAdmissionNativeRetentionBoundary$' 
          exit $LASTEXITCODE
