name: Notifications bounded process admission canary
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, go: '1.25' }
          - { runner: windows-latest, go: '1.26' }
          - { runner: ubicloud-standard-4, go: '1.26' }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          repository: 777genius/agent-notifications
          ref: 217db72c84deec7fdb66a87ebadbe484fd017e5d
          path: source
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          path: fixture
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Repeat bounded startup and unchanged execution contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item fixture/copilot-overlay/copilot_vscode_event_test.go source/cmd/claude-notifications/copilot_vscode_event_test.go
          Set-Location source
          go test -count=3 -race -cover -timeout 5m -v ./cmd/claude-notifications -run '^TestCopilotVSCode(BuiltMainProcess|TransportPanicAndJoinedReader)$'
          exit $LASTEXITCODE
