name: Notifications inert desktop unit canary
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notifier:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: namespace-profile-macos-26
            go: '1.26'
          - runner: namespace-profile-macos-15
            go: '1.25'
          - runner: ubicloud-standard-4
            go: '1.26'
          - runner: windows-latest
            go: '1.26'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          repository: 777genius/agent-notifications
          ref: b0b06fc9451942e8d785e2d793772503582d6efc
          path: source
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          path: fixture
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Install Linux build prerequisite
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Apply test-only overlay and run notifier race suite
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item fixture/notifier-overlay/notifier_test.go source/internal/notifier/notifier_test.go
          Set-Location source
          go test -count=1 -race -timeout 3m -v ./internal/notifier
          exit $LASTEXITCODE
