name: Notifications prompt and cold LaunchServices canary
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: namespace-profile-macos-26, kind: darwin, go: '1.26' }
          - { runner: namespace-profile-macos-26, kind: darwin, go: '1.25' }
          - { runner: ubicloud-standard-4, kind: linux, go: '1.26' }
          - { runner: windows-latest, kind: windows, go: '1.26' }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          repository: 777genius/agent-notifications
          ref: c446dc136e794a474f235e8e3ea9be3aa0f440d6
          path: source
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          path: fixture
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Reproduce ambient prompt on the previous Mac fixture
        if: matrix.kind == 'darwin' && matrix.go == '1.26'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testRoot = Join-Path $env:RUNNER_TEMP ('NEWTEST-prompt-' + [guid]::NewGuid())
          $shim = Join-Path $testRoot 'bin'
          New-Item -ItemType Directory $shim | Out-Null
          $marker = Join-Path $testRoot 'ambient-called'
          $helper = Join-Path $shim 'terminal-notifier'
          Set-Content -NoNewline -LiteralPath $helper -Value "#!/bin/sh`necho `$`$ > `"`$NOTIFIER_AMBIENT_MARKER`"`nexec /bin/sleep 30`n"
          chmod 700 $helper
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $originalPath = $env:PATH
          $env:PATH = $shim + [System.IO.Path]::PathSeparator + $originalPath
          $env:NOTIFIER_AMBIENT_MARKER = $marker
          Set-Location source
          $PSNativeCommandUseErrorActionPreference = $false
          $ErrorActionPreference = 'Continue'
          $baseline = go test -count=1 -race -cover -timeout 8s -v ./internal/notifier -run '^TestBuildTmuxCCNotifierArgs_DisabledAPIErrors$' 2>&1
          $baselineExit = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          $baseline | Write-Output
          if ($baselineExit -eq 0 -or -not (Test-Path -LiteralPath $marker)) { throw 'Previous test did not reproduce ambient prompt delivery' }
          $ambientPid = [int](Get-Content -LiteralPath $marker)
          if ($ambientPid -le 1) { throw 'Invalid owned ambient helper PID' }
          $ambientCommand = /bin/ps -p $ambientPid -o command=
          if ($ambientCommand -match '^/bin/sleep 30$') { Stop-Process -Id $ambientPid -Force }
          Remove-Item -LiteralPath $marker
          Copy-Item ../fixture/health-overlay/notifier_test.go internal/notifier/notifier_test.go
          go test -count=3 -race -cover -timeout 15s -v ./internal/notifier -run '^TestBuildTmuxCCNotifierArgs_DisabledAPIErrors$'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path -LiteralPath $marker) { throw 'Fixed unit prompt executed ambient helper' }
          $env:PATH = $originalPath
          Remove-Item Env:NOTIFIER_AMBIENT_MARKER
      - name: Qualify notifier race and coverage with isolated prompt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:GITHUB_WORKSPACE
          Copy-Item fixture/health-overlay/notifier_test.go source/internal/notifier/notifier_test.go
          Copy-Item fixture/health-overlay/agent_notify_flow_e2e_test.go source/cmd/claude-notifications/agent_notify_flow_e2e_test.go
          Set-Location source
          go test -count=1 -race -cover -timeout 3m -v ./internal/notifier
          exit $LASTEXITCODE
      - name: Repeat real isolated install flow and LaunchServices generation proof
        if: matrix.kind != 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location (Join-Path $env:GITHUB_WORKSPACE 'source')
          go test -count=3 -race -cover -timeout 3m -v ./cmd/claude-notifications -run '^TestAgentNotifyIsolatedInstallFlowE2E$'
          exit $LASTEXITCODE
